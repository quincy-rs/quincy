# Name of the server instance (currently not used as the name of the interface)
name = "tun0"
# The address of the tunnel endpoint and base address of the address pool available to clients
tunnel_network = "10.0.0.1/24"
# Path to the TOML users file for authentication
users_file = "examples/users.toml"

[protocol]
mode = "noise"
# The Noise key exchange algorithm. Must match the client configuration.
key_exchange = "standard"
# Base64-encoded server Noise private key.
# Generate a new key with:
#   quincy-identity noise genkey
private_key = "HsRUK7PIxaIYVu+GQvfEL2OQM4Q6SJ+udEfmdQFd8TI="

[connection]
# The MTU used by the QUIC tunnel and the spawned TUN interface
mtu = 1400
# Maximum number of QUIC handshakes in flight at once (default = 256).
# A full pool pre-empts its oldest pending handshake.
max_pending_handshakes = 256
# Maximum in-flight handshakes per client source address (default = 8).
# IPv4 peers count per address, IPv6 peers per /64.
max_pending_handshakes_per_source = 8

[log]
# The log level
level = "info"
